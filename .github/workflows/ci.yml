# Checks what this repository contains on its own. The game itself (decompiled code, data, assets) is not in the
# repository, so the full build runs locally from your own disc; see README.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python tools compile
        shell: pwsh
        run: python -m py_compile (Get-ChildItem tools -Filter *.py -Recurse).FullName

      - name: Headers compile, format struct sizes hold
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          clang --version
          clang -fsyntax-only --target=i686-pc-windows-msvc -std=gnu11 -fms-extensions -Wno-comment -Idecomp tools/ci/header_check.c

      - name: Build the platform layer (32-bit)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Force out | Out-Null
          $objs = foreach ($src in Get-ChildItem decomp/port -Filter *.c) {
            $obj = "out/$($src.BaseName).obj"
            clang -c --target=i686-pc-windows-msvc -std=gnu11 -fms-extensions -O2 -Wno-comment -Idecomp $src.FullName -o $obj
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $obj
          }
          llvm-lib /out:out/dra2_port.lib $objs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Lua 5.0.3 as the game uses it (LUA_NUMBER float)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          $lua = "third_party/lua-5.0.3"
          $srcs = (Get-ChildItem "$lua/src" -Filter *.c | Where-Object Name -ne 'ltests.c') + (Get-ChildItem "$lua/src/lib" -Filter *.c)
          $objs = foreach ($src in $srcs) {
            $obj = "out/lua_$($src.BaseName).obj"
            clang -c --target=i686-pc-windows-msvc -O2 -w -DLUA_NUMBER=float '-DLUA_NUMBER_SCAN="%f"' '-DLUA_NUMBER_FMT="%.7g"' -I "$lua/include" -I "$lua/src" $src.FullName -o $obj
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $obj
          }
          llvm-lib /out:out/lua50_float.lib $objs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # DRA 2.exe, with the drawn icon (tools/launcher/icon.ico). Your own cover icon (cover.ico) stays local.
      - name: Build the launcher (DRA 2.exe)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Force out/launcher | Out-Null
          llvm-rc /FO out/play.res tools/launcher/play.rc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          clang --target=x86_64-pc-windows-msvc -O2 -fuse-ld=lld tools/launcher/play.c out/play.res -o "out/launcher/DRA 2.exe" -luser32 "-Wl,/subsystem:windows" "-Wl,/entry:wWinMainCRTStartup"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: DRA 2 launcher
          path: out/launcher/DRA 2.exe

      - uses: actions/upload-artifact@v4
        with:
          name: dra2_port-win32
          path: |
            out/dra2_port.lib
            out/lua50_float.lib
